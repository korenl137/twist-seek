<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Twist Seek</title>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <span class="logo-mark">↻</span>
        <div class="logo-text">
          <h1>Twist Seek</h1>
          <p data-i18n="tagline">스크롤 영상 컨트롤러</p>
        </div>
      </div>
      <label class="master-switch" data-i18n-title="masterTitle" title="전체 기능 켜기/끄기">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <main class="content" id="content">
      <section class="card">
        <div class="row">
          <div class="row-text">
            <span class="row-title" data-i18n="hoverTitle">호버 모드</span>
            <span class="row-desc" data-i18n="hoverDesc"
              >클릭 없이 커서를 올린 영상에서 바로 동작</span
            >
          </div>
          <label class="switch">
            <input type="checkbox" id="hoverMode" />
            <span class="track sm"><span class="thumb"></span></span>
          </label>
        </div>

        <div class="divider"></div>

        <div class="row">
          <div class="row-text">
            <span class="row-title" data-i18n="invertTitle">스크롤 방향 반전</span>
            <span class="row-desc" data-i18n="invertDesc"
              >위로 스크롤 시 동작 방향을 뒤집습니다</span
            >
          </div>
          <label class="switch">
            <input type="checkbox" id="invertScroll" />
            <span class="track sm"><span class="thumb"></span></span>
          </label>
        </div>

        <div class="divider"></div>

        <div class="row">
          <div class="row-text">
            <span class="row-title" data-i18n="volTitle">스크롤로 볼륨 조절</span>
            <span class="row-desc" data-i18n="volDesc"
              >수정자 키 없이 스크롤하면 볼륨 ±5%</span
            >
          </div>
          <label class="switch">
            <input type="checkbox" id="volumeScroll" />
            <span class="track sm"><span class="thumb"></span></span>
          </label>
        </div>

        <div class="divider"></div>

        <div class="row">
          <div class="row-text">
            <span class="row-title" data-i18n="osdTitle">화면 피드백 표시</span>
            <span class="row-desc" data-i18n="osdDesc"
              >탐색·볼륨 변화를 영상 위에 잠깐 표시</span
            >
          </div>
          <label class="switch">
            <input type="checkbox" id="showOSD" />
            <span class="track sm"><span class="thumb"></span></span>
          </label>
        </div>
      </section>

      <section class="card seek-card">
        <div class="seek-row">
          <div class="row-text">
            <span class="row-title">Shift + <span data-i18n="wheel">스크롤</span></span>
            <span class="row-desc" data-i18n="seekLongDesc">긴 탐색 간격</span>
          </div>
          <div class="num-field">
            <input type="number" id="seekLarge" min="0.5" max="600" step="0.5" />
            <span class="num-unit" data-i18n="unit">초</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="seek-row">
          <div class="row-text">
            <span class="row-title"
              >Shift + Alt + <span data-i18n="wheel">스크롤</span></span
            >
            <span class="row-desc" data-i18n="seekShortDesc">짧은 탐색 간격</span>
          </div>
          <div class="num-field">
            <input type="number" id="seekSmall" min="0.5" max="600" step="0.5" />
            <span class="num-unit" data-i18n="unit">초</span>
          </div>
        </div>
      </section>

      <section class="cheatsheet">
        <h2 data-i18n="cheatHeader">단축 동작</h2>
        <div class="cheat-row">
          <span class="cheat-keys"><kbd id="activateKey">클릭</kbd></span>
          <span class="cheat-desc" data-i18n="cheatActivate">영상 활성화</span>
        </div>
        <div class="cheat-row">
          <span class="cheat-keys"
            ><kbd data-i18n="wheel">스크롤</kbd></span
          >
          <span class="cheat-desc" data-i18n="cheatVolume">볼륨 조절</span>
        </div>
        <div class="cheat-row">
          <span class="cheat-keys"
            ><kbd>Shift</kbd>+<kbd data-i18n="wheel">스크롤</kbd></span
          >
          <span class="cheat-desc" id="cheatSeekLong">5초 탐색</span>
        </div>
        <div class="cheat-row">
          <span class="cheat-keys"
            ><kbd>Shift</kbd>+<kbd>Alt</kbd>+<kbd data-i18n="wheel">스크롤</kbd></span
          >
          <span class="cheat-desc" id="cheatSeekShort">1초 탐색</span>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span id="status" class="status" data-i18n="statusAuto">자동 저장됨</span>
      <div class="lang-wrap">
        <select id="language" class="lang-select" aria-label="Language">
          <option value="auto">Auto</option>
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
        <span class="version">v1.1.0</span>
      </div>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
